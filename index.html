<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#08090c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Eclypsa"><title>Eclypsa — Vertical Slice</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><div id="toast" class="toast"></div>
<section id="home" class="screen on"><div class="bg"></div><div class="safe"><div class="logo">ECLYPSA<small>LES MORTS ONT ENCORE DES CHOIX</small></div><div class="sigil"><div class="figure"></div><div class="blade"></div></div></div><div class="homeActions"><button class="btn red" onclick="goMap()">Campagne d'essai</button><button class="btn" onclick="show('deck');renderDeck()">Deck</button><button class="btn" onclick="show('collection');renderCollection()">Collection</button></div></section>
<section id="map" class="screen"><div class="safe"><div class="top"><button class="ico" onclick="show('home')">‹</button><div><div class="title">CAMPAGNE</div><div class="sub">L'OMBRE S'ÉTEND</div></div><button class="ico" onclick="show('deck');renderDeck()">☰</button></div><div id="nodes" class="map"></div><div id="mapInfo" class="panel sticky"></div></div></section>
<section id="pre" class="screen"><div class="safe"><div class="top"><button class="ico" onclick="goMap()">‹</button><div id="preN" class="title"></div><div style="width:38px"></div></div><div id="encHero" class="encHero"><div class="encText"><div id="encK" class="sub"></div><h2 id="encName"></h2><div id="encQ" class="sub"></div></div></div><div id="encM" class="mod"></div><div class="panel"><div class="sub">OBJECTIF</div><div id="encO" style="font-size:13px;margin-top:4px"></div></div><button class="btn red" style="margin-top:10px" onclick="startFight()">Combattre</button></div></section>
<section id="fight" class="screen"><div class="safe" style="padding-left:8px;padding-right:8px"><div class="combatTop"><button class="ico" onclick="goMap()">⚙</button><div id="round" class="title" style="font-size:16px"></div><div id="pips" class="pips"></div></div><div class="hero"><div class="portrait"></div><div><b id="eName"></b><div class="bar"><div id="eFill" class="fill"></div></div><div id="eHp" class="sub"></div></div><div>◆ <span id="eRes"></span></div></div><div class="board"><div id="eLanes" class="lanes"></div><div class="sep">FIN DE ROUND · LES VOIES S'AFFRONTENT</div><div id="pLanes" class="lanes"></div></div><div class="hero"><div class="portrait"></div><div><b>Myr — Porte-Écho</b><div class="bar"><div id="pFill" class="fill"></div></div><div id="pHp" class="sub"></div></div><div>◆ <span id="pRes"></span></div></div><div id="hint" class="hint"></div><div class="sub" style="margin:4px 0">TON ARSENAL</div><div id="ars" class="ars"></div><div class="actions"><button class="sm" onclick="channel()">Canaliser<br><span class="sub">+1 ressource</span></button><button class="sm" onclick="levelUp()">S'élever<br><span class="sub">niveau</span></button><button class="sm red" onclick="passTurn()">Passer<br><span class="sub">résoudre</span></button></div></div></section>
<section id="result" class="screen"><div class="safe result"><div id="rK" class="sub"></div><h1 id="rTitle"></h1><div id="rPanel" class="panel reward"></div><button id="rBtn" class="btn red" style="margin-top:12px"></button></div></section>
<section id="deck" class="screen"><div class="safe"><div class="top"><button class="ico" onclick="goMap()">‹</button><div><div class="title">DECK</div><div id="deckCount" class="sub"></div></div><div style="width:38px"></div></div><div class="panel" style="font-size:11px;color:#c7bfb3">12 cartes maximum. Cette version sert surtout à tester le rythme des 10 combats.</div><h3 class="title" style="font-size:18px">Deck actuel</h3><div id="deckGrid" class="grid"></div></div></section>
<section id="collection" class="screen"><div class="safe"><div class="top"><button class="ico" onclick="show('home')">‹</button><div><div class="title">COLLECTION</div><div id="colCount" class="sub"></div></div><div style="width:38px"></div></div><div id="colGrid" class="grid"></div></div></section>
<script src="data.js"></script><script src="app.js"></script></main></body></html>
